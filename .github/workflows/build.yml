name: Build Paper plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find the Maven project
        id: project
        shell: bash
        run: |
          POM="$(find . -type f -name pom.xml -not -path '*/target/*' -not -path '*/.git/*' -print -quit)"
          if [ -z "$POM" ]; then
            echo "::error::No pom.xml found. Upload the complete plugin project, including pom.xml and src."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$POM")"
          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "jar=$PROJECT_DIR/target/InfamySMP.jar" >> "$GITHUB_OUTPUT"
          echo "Building project at $PROJECT_DIR"

      - name: Build plugin JAR
        run: mvn --batch-mode --no-transfer-progress -f "${{ steps.project.outputs.pom }}" clean package

      - name: Upload Paper plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: InfamySMP-Paper
          path: ${{ steps.project.outputs.jar }}
          if-no-files-found: error
          retention-days: 30

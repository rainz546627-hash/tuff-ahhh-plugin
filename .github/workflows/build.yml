name: Build Paper plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin jar
        run: mvn --batch-mode --no-transfer-progress -f InfamySMP-GitHub-Upload/pom.xml clean package

      - name: Publish installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: InfamySMP-Paper-1.21.11
          path: InfamySMP-GitHub-Upload/target/InfamySMP.jar
          if-no-files-found: error
          retention-days: 30

name: Build Paper plugin

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find Maven project
        id: project
        shell: bash
        run: |
          POM="$(find . -type f -name pom.xml -not -path '*/target/*' -print -quit)"
          if [ -z "$POM" ]; then
            echo "::error::No pom.xml found. Upload the plugin project files to this repository."
            exit 1
          fi
          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "jar=$(dirname "$POM")/target/InfamySMP.jar" >> "$GITHUB_OUTPUT"

      - name: Build plugin JAR
        run: mvn --batch-mode --no-transfer-progress -f "${{ steps.project.outputs.pom }}" clean package

      - name: Upload Paper plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: InfamySMP-Paper
          path: ${{ steps.project.outputs.jar }}
          if-no-files-found: error

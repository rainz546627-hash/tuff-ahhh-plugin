name: InfamySMP
version: 1.0.0
main: dev.infamy.smp.InfamyPlugin
api-version: '1.21'
description: Infamy PvP progression, shards, effects, titles, and custom gear.
commands:
  infamy:
    description: View Infamy, manage your score, or obtain custom equipment.
    usage: /infamy [player|leaderboard|withdraw <amount>|weapons [player]|armor [player]|gear [player]|set <player> <score>|reset <player>]
    aliases: [infamies]
permissions:
  infamy.use:
    description: Withdraw positive Infamy as a shard.
    default: true
  infamy.admin:
    description: Set/reset player Infamy or give custom Infamy equipment.
    default: op

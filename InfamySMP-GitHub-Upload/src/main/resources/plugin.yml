name: InfamySMP
version: 1.0.0
main: dev.infamy.smp.InfamyPlugin
api-version: '1.21'
description: PvP Infamy, reputation titles, rewards, shards, and custom gear.
author: InfamySMP
commands:
  infamy:
    description: View and manage Infamy, shards, and custom equipment.
    usage: /infamy [player|leaderboard|withdraw <amount>|gear <player>|set <player> <score>|reset <player>]
    aliases: [infamies]
permissions:
  infamy.use:
    description: Withdraw your positive Infamy as a shard.
    default: true
  infamy.admin:
    description: Set/reset player Infamy and give Infamy equipment.
    default: op
